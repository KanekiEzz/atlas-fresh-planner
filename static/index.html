<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Fresh - Daily Export Planner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>Atlas Fresh</strong>
        <span>Daily Export Planner</span>
      </div>
      <nav class="tabs" aria-label="Workspace">
        <button class="tab active" data-view="overview">Overview</button>
        <button class="tab" data-view="production">Production</button>
        <button class="tab" data-view="commercial">Commercial</button>
        <button class="tab" data-view="allocations">Allocations</button>
        <button class="tab" data-view="assistant">Assistant</button>
      </nav>
      <div class="actions">
        <span id="dataStatus" class="status-dot">No data</span>
        <button id="loadBtn" class="secondary">Load Workbook</button>
        <button id="recalcBtn" class="primary">Recalculate Plan</button>
        <small>Daily snapshot</small>
      </div>
    </header>

    <main id="app" class="workspace" tabindex="-1"></main>

    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-panel">
        <div class="drawer-head">
          <div>
            <span class="eyebrow">Why this matters</span>
            <h2 id="drawerTitle">Farm segment</h2>
          </div>
          <button id="drawerClose" class="icon-btn" aria-label="Close">x</button>
        </div>
        <div id="drawerBody"></div>
      </div>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
